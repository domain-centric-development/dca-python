# The workspace of dca-python: two distributions, one toolchain. `uv sync` installs both in editable form with the
# tools the gate runs: pytest, mypy --strict, ruff check, ruff format --check.
[project]
name = "dca-python"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["dca-building-blocks", "dca-rules"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["dca-building-blocks", "dca-rules"]

[tool.uv.sources]
dca-building-blocks = { workspace = true }
dca-rules = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["dca-building-blocks/tests", "dca-rules/tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["dca-building-blocks/src", "dca-building-blocks/tests", "dca-rules/src", "dca-rules/tests"]
exclude = ["dca-rules/fixtures/"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dca-rules/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
